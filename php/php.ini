memory_limit=512M
upload_max_filesize=64M
post_max_size=64M
max_execution_time=300
max_input_time=300
max_input_vars=5000

opcache.enable=1
opcache.memory_consumption=128
opcache.interned_strings_buffer=8
opcache.max_accelerated_files=10000
; Immutable production/staging images: files don't change after build, so 0
; skips per-request mtime checks. Flip to 1 only for local iterative dev.
opcache.validate_timestamps=0
